name: Build CoffeeStrap Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify single EXE
        shell: pwsh
        run: ./build/windows/Build.ps1 -Publish
      - uses: actions/upload-artifact@v7
        with:
          name: CoffeeStrap-win-x64
          path: Release/
          if-no-files-found: error
