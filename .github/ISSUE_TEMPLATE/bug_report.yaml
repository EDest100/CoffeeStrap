name: Bug report
title: '[BUG] '
description: Tell me what went wrong in CoffeeStrap.
body:
  - type: input
    id: version
    attributes:
      label: CoffeeStrap version
      placeholder: e.g. 0.10.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Windows version and GPU
      description: Include these if the issue involves graphics or launching.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you expect, what happened instead, and how can I reproduce it?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant logs
      description: Include the enabled mods or tweaks if the issue happens in Roblox.
